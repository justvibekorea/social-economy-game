<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사회연대경제 성향 테스트 · 협동 여권</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Pretendard', -apple-system, sans-serif; }
  #app {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: radial-gradient(circle at 28% 15%, #22384A 0%, #16232E 55%, #0F1A22 100%);
  }
  .font-display { font-family: 'Pretendard', -apple-system, sans-serif; font-weight: 800; letter-spacing: -0.01em; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .fade-up { animation: fadeUp .45s ease forwards; }
  @keyframes stampIn {
    0% { transform: scale(.3) rotate(-35deg); opacity: 0; }
    60% { transform: scale(1.08) rotate(-4deg); opacity: 1; }
    100% { transform: scale(1) rotate(-6deg); opacity: 1; }
  }
  .stamp-in { animation: stampIn .7s cubic-bezier(.34,1.56,.64,1) forwards; }
  @keyframes popDot { 0% { transform: scale(0); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }
  .pop-dot { animation: popDot .3s ease forwards; }
  button { font-family: inherit; cursor: pointer; }
  button:active { transform: scale(.96); }
  button:disabled { cursor: default; opacity: .6; }
  .intro-wrap { max-width: 420px; width: 100%; text-align: center; }
  .card { background: #F3EAD3; color: #1B2A38; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.4); padding: 32px; width: 100%; max-width: 420px; }
  .eyebrow { font-size: 12px; letter-spacing: .25em; text-transform: uppercase; color: #D9A441; margin-bottom: 12px; }
  .btn-primary { background: #D9A441; color: #1B2A38; border: none; padding: 14px 32px; border-radius: 999px; font-weight: 700; font-size: 14px; }
  .row-between { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .back-btn { display: flex; align-items: center; gap: 4px; font-size: 12px; color: #6B5B45; background: none; border: none; padding: 0; }
  .qprogress { display: flex; gap: 8px; justify-content: center; margin-bottom: 32px; }
  .dot { width: 9px; height: 9px; border-radius: 999px; border: 1.5px solid #B9AD91; }
  .qtext { font-size: 20px; text-align: center; line-height: 1.6; min-height: 130px; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
  .yesno-row { display: flex; gap: 16px; margin-top: 24px; }
  .yesno { flex: 1; padding: 16px; border-radius: 999px; font-weight: 700; font-size: 14px; background: transparent; border: 2px solid; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 20px; }
  .chip { font-size: 12px; padding: 4px 12px; border-radius: 999px; font-weight: 600; }
  .bars { display: flex; flex-direction: column; gap: 8px; }
  .bar-row { display: flex; align-items: center; gap: 12px; }
  .bar-label { font-size: 12px; width: 64px; flex-shrink: 0; color: #6B5B45; }
  .bar-track { flex: 1; height: 8px; border-radius: 999px; background: #E4DAC0; }
  .bar-fill { height: 8px; border-radius: 999px; }
  .bar-value { font-size: 12px; width: 16px; text-align: right; color: #6B5B45; }
  .btn-reset { background: #1B2A38; color: #F3EAD3; border: none; padding: 12px 24px; border-radius: 999px; font-weight: 700; font-size: 14px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {

      keywords: ["공동소유", "1인 1표", "상호부조", "신뢰기반", "합의문화"],

      keywords: ["소셜미션", "지속가능성", "혁신", "실행력", "시장경쟁력"],

    VE: {

      desc: "지역 주민이 지역의 자원으로 지역의 문제를 푸는 곳. 사회란 거창한 개념이 아니라 매일 마주치는 이웃과 골목이라고 여겨요. 멀리 있는 변화보다 발밑에서 시작되는 변화를 믿는 사람이에요.",

    NPO: {

      desc: "이윤 배분 없이, 미션과 공익 실현을 가장 먼저 두는 곳. 눈앞의 이익보다 옳다고 믿는 방향을 지키는 사람이에요. 시간이 걸려도 세상의 기준 자체를 바꾸는 일에 마음이 끌려요.",
      keywords: ["미션중심", "공익", "옹호와 캠페인", "헌신", "시스템적 시각"],

    }
  };

  var PRIORITY = ["COOP", "SE", "VE", "SR", "NPO"];

  var QUESTIONS = [
    { text: "모임에서 결정을 내릴 때, 한 사람이 빠르게 정하기보다 다 같이 의논해서 정하는 쪽이 좋다.", yes: { COOP: 2, VE: 1 }, no: { SE: 1, NPO: 1 } },
    { text: "돈을 버는 것보다, 사회 문제를 실제로 해결했다는 성취감이 더 크게 다가온다.", yes: { NPO: 2, SR: 1 }, no: { SE: 2, COOP: 1 } },
    { text: "내가 사는 동네에 필요한 걸 이웃과 함께 직접 만들어보고 싶다는 생각을 자주 한다.", yes: { VE: 2, COOP: 1 }, no: { SE: 1, NPO: 1 } },
    { text: "누군가 자립하는 과정을 곁에서 꾸준히 지켜보고 돕는 일에 보람을 느낄 것 같다.", yes: { SR: 2, NPO: 1 }, no: { SE: 1, VE: 1 } },
    { text: "새로운 아이디어가 생기면, 시장에서 통할지 수익 구조부터 계산해보는 편이다.", yes: { SE: 2 }, no: { NPO: 1, COOP: 1 } },
    { text: "자원(돈, 시간, 공간)을 여러 사람과 공동으로 소유하고 책임지는 구조가 부담보다 든든함으로 느껴진다.", yes: { COOP: 2, VE: 1 }, no: { SE: 1, SR: 1 } },
    { text: "이윤이 남지 않아도, 의미 있는 일이라면 기꺼이 시간을 낸다.", yes: { NPO: 2, SR: 1 }, no: { SE: 1, COOP: 1 } },
    { text: "문제를 풀 때 외부 전문가의 분석보다, 그 안에 있는 사람들의 경험과 이야기를 더 신뢰한다.", yes: { VE: 2, COOP: 1 }, no: { SE: 1, SR: 1 } },
    { text: "느리더라도 사람 중심으로, 한 사람 한 사람의 변화를 지켜보는 과정을 소중히 여긴다.", yes: { SR: 2, NPO: 1 }, no: { SE: 1, VE: 1 } }
  ];

  var QUESTION_ART = [
    '<svg viewBox="0 0 120 90" width="140" height="100"><ellipse cx="60" cy="72" rx="36" ry="8" fill="none" stroke="#1B2A38" stroke-width="3"/><circle cx="36" cy="34" r="11" fill="#EAD9B8" stroke="#1B2A38" stroke-width="2.5"/><circle cx="60" cy="24" r="11" fill="#EAD9B8" stroke="#1B2A38" stroke-width="2.5"/><circle cx="84" cy="34" r="11" fill="#EAD9B8" stroke="#1B2A38" stroke-width="2.5"/><path d="M26 58 Q36 44 46 58" fill="none" stroke="#1B2A38" stroke-width="2.5"/><path d="M50 52 Q60 38 70 52" fill="none" stroke="#1B2A38" stroke-width="2.5"/><path d="M74 58 Q84 44 94 58" fill="none" stroke="#1B2A38" stroke-width="2.5"/></svg>',
    '<svg viewBox="0 0 120 90" width="140" height="100"><path d="M60 22 C52 10 34 14 34 30 C34 44 60 60 60 60 C60 60 86 44 86 30 C86 14 68 10 60 22 Z" fill="#D9A441" stroke="#1B2A38" stroke-width="2.5"/><circle cx="60" cy="76" r="12" fill="none" stroke="#8A7A5E" stroke-width="2.5"/><text x="60" y="80" text-anchor="middle" font-size="11" fill="#8A7A5E" font-weight="700">\u20a9</text></svg>',
    '<svg viewBox="0 0 120 90" width="140" height="100"><path d="M16 50 L32 32 L48 50 Z" fill="#D9A441" stroke="#1B2A38" stroke-width="2.5"/><rect x="22" y="50" width="20" height="20" fill="#EAD9B8" stroke="#1B2A38" stroke-width="2.5"/><path d="M72 50 L88 32 L104 50 Z" fill="#D9A441" stroke="#1B2A38" stroke-width="2.5"/><rect x="78" y="50" width="20" height="20" fill="#EAD9B8" stroke="#1B2A38" stroke-width="2.5"/><path d="M57 64 Q60 50 63 64" fill="none" stroke="#1B2A38" stroke-width="2.5"/><circle cx="60" cy="48" r="7" fill="#D9A441" stroke="#1B2A38" stroke-width="2"/></svg>',
    '<svg viewBox="0 0 120 90" width="140" height="100"><circle cx="42" cy="26" r="10" fill="#EAD9B8" stroke="#1B2A38" stroke-width="2.5"/><rect x="34" y="36" width="16" height="28" rx="8" fill="#EAD9B8" stroke="#1B2A38" stroke-width="2.5"/><circle cx="74" cy="22" r="9" fill="#EAD9B8" stroke="#1B2A38" stroke-width="2.5"/><rect x="67" y="31" width="14" height="26" rx="7" fill="#EAD9B8" stroke="#1B2A38" stroke-width="2.5"/><line x1="50" y1="46" x2="67" y2="42" stroke="#1B2A38" stroke-width="2.5"/><circle cx="28" cy="78" r="2.5" fill="#8A7A5E"/><circle cx="46" cy="82" r="2.5" fill="#8A7A5E"/><circle cx="64" cy="78" r="2.5" fill="#8A7A5E"/><circle cx="82" cy="82" r="2.5" fill="#8A7A5E"/></svg>',
    '<svg viewBox="0 0 120 90" width="140" height="100"><rect x="20" y="54" width="14" height="24" fill="#D9A441" stroke="#1B2A38" stroke-width="2.5"/><rect x="42" y="38" width="14" height="40" fill="#D9A441" stroke="#1B2A38" stroke-width="2.5"/><rect x="64" y="20" width="14" height="58" fill="#D9A441" stroke="#1B2A38" stroke-width="2.5"/><circle cx="92" cy="24" r="10" fill="none" stroke="#1B2A38" stroke-width="3"/><line x1="99" y1="31" x2="107" y2="39" stroke="#1B2A38" stroke-width="3" stroke-linecap="round"/></svg>',
    '<svg viewBox="0 0 120 90" width="140" height="100"><path d="M38 40 L82 40 L75 70 L45 70 Z" fill="#D9A441" stroke="#1B2A38" stroke-width="2.5"/><path d="M45 40 Q60 22 75 40" fill="none" stroke="#1B2A38" stroke-width="2.5"/><circle cx="16" cy="28" r="7" fill="#EAD9B8" stroke="#1B2A38" stroke-width="2"/><circle cx="104" cy="28" r="7" fill="#EAD9B8" stroke="#1B2A38" stroke-width="2"/><circle cx="16" cy="62" r="7" fill="#EAD9B8" stroke="#1B2A38" stroke-width="2"/><circle cx="104" cy="62" r="7" fill="#EAD9B8" stroke="#1B2A38" stroke-width="2"/><path d="M23 30 L40 44" stroke="#8A7A5E" stroke-width="2" fill="none"/><path d="M97 30 L80 44" stroke="#8A7A5E" stroke-width="2" fill="none"/><path d="M23 60 L45 58" stroke="#8A7A5E" stroke-width="2" fill="none"/><path d="M97 60 L75 58" stroke="#8A7A5E" stroke-width="2" fill="none"/></svg>',
    '<svg viewBox="0 0 120 90" width="140" height="100"><circle cx="60" cy="46" r="30" fill="none" stroke="#1B2A38" stroke-width="3"/><path d="M60 34 C57 29 48 31 48 38 C48 44 60 52 60 52 C60 52 72 44 72 38 C72 31 63 29 60 34 Z" fill="#D9A441" stroke="#1B2A38" stroke-width="2"/><line x1="60" y1="16" x2="60" y2="22" stroke="#1B2A38" stroke-width="3"/><line x1="60" y1="70" x2="60" y2="76" stroke="#1B2A38" stroke-width="3"/><line x1="30" y1="46" x2="36" y2="46" stroke="#1B2A38" stroke-width="3"/><line x1="84" y1="46" x2="90" y2="46" stroke="#1B2A38" stroke-width="3"/></svg>',

    '<svg viewBox="0 0 120 90" width="140" height="100"><ellipse cx="60" cy="78" rx="30" ry="6" fill="#8A7A5E" opacity="0.3"/><path d="M60 78 C60 58 60 48 60 42" fill="none" stroke="#1B2A38" stroke-width="3"/><path d="M60 48 C50 48 44 40 44 32 C54 32 60 38 60 48 Z" fill="#D9A441" stroke="#1B2A38" stroke-width="2.5"/><path d="M60 42 C70 42 76 34 76 26 C66 26 60 32 60 42 Z" fill="#D9A441" stroke="#1B2A38" stroke-width="2.5"/><circle cx="60" cy="22" r="3" fill="#D9A441"/></svg>'
  ];

  var ZERO_SCORES = { COOP: 0, SE: 0, VE: 0, SR: 0, NPO: 0 };

  var state = {
    stage: "intro", // intro | question | result
    qIndex: 0,
    scores: Object.assign({}, ZERO_SCORES),
    answers: [], // {delta, dominant}
    busy: false
  };

  function addDelta(scores, delta) {
    var next = Object.assign({}, scores);
    Object.keys(delta).forEach(function (k) { next[k] = (next[k] || 0) + delta[k]; });
    return next;
  }
  function subDelta(scores, delta) {
    var next = Object.assign({}, scores);
    Object.keys(delta).forEach(function (k) { next[k] = (next[k] || 0) - delta[k]; });
    return next;
  }
  function dominantOf(delta) {
    return Object.keys(delta).sort(function (a, b) { return delta[b] - delta[a]; })[0];
  }
  function getResult(scores) {
    var max = Math.max.apply(null, PRIORITY.map(function (k) { return scores[k]; }));
    var tied = PRIORITY.filter(function (k) { return scores[k] === max; });
    return { primary: tied[0], tied: tied };
  }

  function hatSVG(typeKey, color) {
    switch (typeKey) {
      case "COOP":
        return '<g fill="none" stroke="' + color + '" stroke-width="5" stroke-linecap="round">' +

        return '<g stroke="' + INK + '" stroke-width="3" stroke-linejoin="round">' +

      default:
        return "";
    }
  }

  function characterSVG(type) {
    var initial = type.name.charAt(0);
    return '' +
      '<svg viewBox="0 0 140 175" width="100%" height="100%">' +
      '<ellipse cx="70" cy="164" rx="40" ry="6" fill="#00000022"/>' +
      '<ellipse cx="58" cy="152" rx="10" ry="7" fill="' + SKIN + '" stroke="' + INK + '" stroke-width="3"/>' +

      '<rect x="38" y="86" width="64" height="58" rx="28" fill="' + SKIN + '" stroke="' + INK + '" stroke-width="3"/>' +
      '<rect x="16" y="90" width="15" height="34" rx="7" fill="' + SKIN + '" stroke="' + INK + '" stroke-width="3" transform="rotate(18 23 90)"/>' +
      '<rect x="109" y="90" width="15" height="34" rx="7" fill="' + SKIN + '" stroke="' + INK + '" stroke-width="3" transform="rotate(-18 117 90)"/>' +
      '<circle cx="70" cy="60" r="32" fill="' + SKIN + '" stroke="' + INK + '" stroke-width="3"/>' +
      hatSVG(type.key, type.color) +

      '<circle cx="80" cy="58" r="3" fill="' + INK + '"/>' +
      '<circle cx="50" cy="64" r="4.5" fill="' + type.color + '" opacity="0.3"/>' +
      '<circle cx="90" cy="64" r="4.5" fill="' + type.color + '" opacity="0.3"/>' +
      '<path d="M58 68 Q70 76 82 68" stroke="' + INK + '" stroke-width="3" fill="none" stroke-linecap="round"/>' +
      '<circle cx="70" cy="112" r="15" fill="' + type.color + '" stroke="' + INK + '" stroke-width="2.5"/>' +
      '<text x="70" y="117" text-anchor="middle" font-size="14" font-weight="700" fill="' + PAPER + '">' + initial + '</text>' +
      '</svg>';
  }

  function render() {
    var app = document.getElementById("app");
    if (state.stage === "intro") app.innerHTML = renderIntro();
    else if (state.stage === "question") app.innerHTML = renderQuestion();
    else app.innerHTML = renderResult();
    bindEvents();
  }

  function renderIntro() {
    var introChars = PRIORITY.map(function (k) {
      var t = TYPES[k];
      return '' +
        '<div style="display:flex;flex-direction:column;align-items:center;gap:4px;">' +
        '<div style="width:52px;height:64px;">' + characterSVG(t) + '</div>' +
        '<span style="font-size:10px;color:#C7D2DB;">' + t.name + '</span>' +
        '</div>';
    }).join("");

    return '' +
      '<div class="intro-wrap fade-up">' +
      '<p class="eyebrow">Solidarity Economy Passport</p>' +
      '<h1 class="font-display" style="font-size:32px;color:' + PAPER + ';line-height:1.4;margin-bottom:16px;">나와 결이 맞는<br>사회연대경제는 어디일까요?</h1>' +
      '<p style="font-size:14px;color:#C7D2DB;line-height:1.8;margin-bottom:24px;">9개의 질문에 그렇다 / 아니다로 답해보세요.<br>협동조합, 사회적기업, 마을기업, 자활기업, 비영리단체<br>다섯 곳 중 당신과 가장 잘 맞는 곳을 찾아드릴게요.</p>' +
      '<div style="display:flex;justify-content:center;gap:14px;margin-bottom:32px;flex-wrap:wrap;">' + introChars + '</div>' +
      '<button id="startBtn" class="btn-primary">여권 펼치기 →</button>' +
      '</div>';
  }

  function renderQuestion() {
    var total = QUESTIONS.length;
    var dots = QUESTIONS.map(function (_, i) {
      var done = i < state.answers.length;
      var color = done ? TYPES[state.answers[i].dominant].color : "transparent";
      var border = done ? color : "#B9AD91";
      return '<span class="dot ' + (done ? "pop-dot" : "") + '" style="border-color:' + border + ';background:' + color + ';"></span>';
    }).join("");

    var hasBack = state.answers.length > 0;

    return '' +
      '<div class="card">' +
      '<div class="row-between">' +
      '<button id="backBtn" class="back-btn" style="visibility:' + (hasBack ? "visible" : "hidden") + '">&#8592; 이전</button>' +
      '<p style="font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#8A7A5E;margin:0;">질문 ' + (state.qIndex + 1) + ' / ' + total + '</p>' +
      '</div>' +
      '<div class="qprogress">' + dots + '</div>' +
      '<div style="display:flex;justify-content:center;margin-bottom:8px;height:100px;">' + QUESTION_ART[state.qIndex] + '</div>' +
      '<div class="qtext font-display fade-up" key="' + state.qIndex + '">' + QUESTIONS[state.qIndex].text + '</div>' +
      '<div class="yesno-row">' +
      '<button id="yesBtn" class="yesno" style="border-color:#2F6F62;color:#2F6F62;" ' + (state.busy ? "disabled" : "") + '>그렇다</button>' +
      '<button id="noBtn" class="yesno" style="border-color:#B4442E;color:#B4442E;" ' + (state.busy ? "disabled" : "") + '>아니다</button>' +
      '</div>' +
      '</div>';
  }

  function renderResult() {
    var result = getResult(state.scores);
    var type = TYPES[result.primary];
    var maxScore = Math.max.apply(null, PRIORITY.map(function (k) { return state.scores[k]; }).concat([1]));
    var secondary = result.tied.slice(1).map(function (k) { return TYPES[k].name; });

    var chips = type.keywords.map(function (kw) {
      return '<span class="chip" style="background:' + type.color + '1A;color:' + type.color + ';">#' + kw + '</span>';
    }).join("");

    var bars = PRIORITY.map(function (k) {
      var pct = (state.scores[k] / maxScore) * 100;
      return '' +
        '<div class="bar-row">' +
        '<span class="bar-label">' + TYPES[k].name + '</span>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:' + TYPES[k].color + ';"></div></div>' +
        '<span class="bar-value">' + state.scores[k] + '</span>' +
        '</div>';
    }).join("");

    return '' +
      '<div class="card fade-up">' +
      '<p style="font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#8A7A5E;text-align:center;margin-bottom:24px;">Solidarity Economy Passport · Result</p>' +
      '<div style="position:relative;display:flex;justify-content:center;margin-bottom:16px;height:185px;">' +
      '<div class="stamp-in" style="width:148px;height:172px;">' + characterSVG(type) + '</div>' +
      '<div style="position:absolute;right:calc(50% - 100px);bottom:4px;width:62px;height:62px;border-radius:999px;border:2.5px solid ' + type.color + ';box-shadow:inset 0 0 0 4px ' + PAPER + ', inset 0 0 0 5px ' + type.color + '77;background:' + type.color + '12;display:flex;align-items:center;justify-content:center;transform:rotate(-16deg);">' +
      '<span class="font-display" style="font-size:10px;line-height:1.15;color:' + type.color + ';text-align:center;letter-spacing:.03em;">CERTI<br>FIED</span>' +
      '</div>' +
      '</div>' +
      '<p style="text-align:center;font-size:12px;font-weight:700;letter-spacing:.2em;color:' + type.color + ';margin-bottom:4px;">' + type.name + '</p>' +
      '<p class="font-display" style="text-align:center;font-size:24px;margin-bottom:4px;">' + type.nickname + '</p>' +
      (secondary.length ? '<p style="text-align:center;font-size:12px;color:#8A7A5E;margin-bottom:12px;">' + secondary.join(", ") + ' 성향도 비슷하게 나타났어요.</p>' : "") +
      '<p style="font-size:14px;text-align:center;line-height:1.8;color:#3A3226;margin-bottom:20px;">' + type.desc + '</p>' +
      '<div class="chips">' + chips + '</div>' +
      '<p style="font-size:12px;text-align:center;color:#8A7A5E;margin-bottom:24px;">' + type.example + '</p>' +
      '<p style="font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#8A7A5E;margin-bottom:12px;">나의 성향 지수</p>' +
      '<div class="bars">' + bars + '</div>' +
      '<div style="display:flex;justify-content:center;margin-top:24px;">' +
      '<button id="resetBtn" class="btn-reset">다시 테스트하기</button>' +
      '</div>' +
      '</div>';
  }

  function bindEvents() {
    var startBtn = document.getElementById("startBtn");
    if (startBtn) startBtn.onclick = function () {
      state.stage = "question";
      state.qIndex = 0;
      state.scores = Object.assign({}, ZERO_SCORES);
      state.answers = [];
      render();
    };

    var backBtn = document.getElementById("backBtn");
    if (backBtn) backBtn.onclick = function () {
      if (state.answers.length === 0 || state.busy) return;
      var last = state.answers[state.answers.length - 1];
      state.scores = subDelta(state.scores, last.delta);
      state.answers = state.answers.slice(0, -1);
      state.qIndex -= 1;
      render();
    };

    var yesBtn = document.getElementById("yesBtn");
    var noBtn = document.getElementById("noBtn");
    if (yesBtn) yesBtn.onclick = function () { answer(true); };
    if (noBtn) noBtn.onclick = function () { answer(false); };

    var resetBtn = document.getElementById("resetBtn");
    if (resetBtn) resetBtn.onclick = function () {
      state.stage = "intro";
      state.qIndex = 0;
      state.scores = Object.assign({}, ZERO_SCORES);
      state.answers = [];
      render();
    };
  }

  function answer(isYes) {
    if (state.busy) return;
    state.busy = true;
    var q = QUESTIONS[state.qIndex];
    var delta = isYes ? q.yes : q.no;
    var dominant = dominantOf(delta);
    var nextScores = addDelta(state.scores, delta);
    var nextAnswers = state.answers.concat([{ delta: delta, dominant: dominant }]);

    setTimeout(function () {
      state.scores = nextScores;
      state.answers = nextAnswers;
      if (state.qIndex + 1 < QUESTIONS.length) {
        state.qIndex += 1;
        state.busy = false;
      } else {
        state.stage = "result";
        state.busy = false;
      }
      render();
    }, 180);
  }

  render();
})();
</script>
</body>
</html>
